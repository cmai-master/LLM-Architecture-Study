        }

            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {

        }

        .btn-primary:hover {

            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background: #6d28d9;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(124, 58, 237, 0.4);

        }

            border-radius: 8px;
            font-size: 1em;
            background: var(--card-bg);
            color: var(--text-primary);
            min-width: 300px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .timeline {
            position: relative;
            padding: 40px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 60px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timeline-item.left {
            padding-right: 55%;
        }

        .timeline-item.right {
            padding-left: 55%;
        }

        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 30px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 4px solid var(--dark-bg);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.3);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.1);
            }
        }

            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
            cursor: pointer;
        }

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: var(--primary-color);
        }

            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .model-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .company {
            color: var(--text-secondary);
            font-size: 1em;
            margin-bottom: 15px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .tag {
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            white-space: nowrap;

        .tag-transformer { background: #3b82f6; color: white; }
        .tag-moe { background: #8b5cf6; color: white; }
        .tag-multimodal { background: #ec4899; color: white; }
        .tag-reasoning { background: #f59e0b; color: white; }
        .tag-opensource { background: #10b981; color: white; }
        .tag-ssm { background: #06b6d4; color: white; }
        .tag-china { background: #ef4444; color: white; }

            color: var(--text-secondary);
            line-height: 1.8;
            margin-top: 15px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

            background: var(--card-bg);

            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

            from {

            }
            to {

            font-size: 2em;
            font-weight: bold;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s;

            background: var(--dark-bg);

                padding-right: 20px;

            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 10px;
        }

            align-items: center;
            gap: 8px;
        }

            width: 20px;
            height: 20px;
            border-radius: 4px;

</head>

                `
            };

            return diagrams[archType] || diagrams['decoder-only'];
        }

        function showDetails(index) {
            const model = models[index];
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');

            const tagHTML = model.tags.map(tag =>
                `<span class="tag tag-${tag}">${getTagLabel(tag)}</span>`
            ).join('');

            const architectureDiagram = getArchitectureDiagram(model);

            content.innerHTML = `
                <h2>${model.name}</h2>
                <h3 style="color: var(--text-secondary); margin-bottom: 20px;">${model.company} | ${model.year}</h3>
                <div class="tags" style="margin-bottom: 20px;">${tagHTML}</div>
                <p style="font-size: 1.1em; line-height: 1.8; margin-bottom: 30px;">${model.description}</p>

                <div class="architecture-viz" style="background: var(--dark-bg); padding: 30px; border-radius: 15px; margin-bottom: 30px;">
                    <h3 style="margin-bottom: 20px; color: var(--primary-color);">아키텍처 다이어그램</h3>
                    ${architectureDiagram}
                </div>

                <div class="architecture-viz">
                    <h3 style="margin-bottom: 20px;">핵심 혁신</h3>
                    <div class="arch-box">${model.innovation}</div>
                </div>

                <table class="comparison-table">
                    <tr>
                        <th>속성</th>
                        <th>상세</th>
                    </tr>
                    <tr>
                        <td>파라미터 수</td>
                        <td>${model.parameters}</td>
                    </tr>
                    <tr>
                        <td>컨텍스트 길이</td>
                        <td>${model.context} 토큰</td>
                    </tr>
                    <tr>
                        <td>주요 특징</td>
                        <td>${model.tags.map(t => getTagLabel(t)).join(', ')}</td>
                    </tr>
                    <tr>
                        <td>출시 연도</td>
                        <td>${model.year}</td>
                    </tr>
                </table>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function showComparison() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');

            const comparisonHTML = `
                <h2>아키텍처 패러다임 비교</h2>
                <table class="comparison-table">
                    <tr>
                        <th>아키텍처</th>
                        <th>주요 모델</th>
                        <th>장점</th>
                        <th>단점</th>
                    </tr>
                    <tr>
                        <td><strong>Decoder-only</strong></td>
                        <td>GPT, LLaMA, PaLM</td>
                        <td>생성 작업에 최적화, 구조 단순</td>
                        <td>양방향 컨텍스트 활용 불가</td>
                    </tr>
                    <tr>
                        <td><strong>Encoder-only</strong></td>
                        <td>BERT</td>
                        <td>문맥 이해 우수, 양방향</td>
                        <td>생성 작업 불가</td>
                    </tr>
                    <tr>
                        <td><strong>Encoder-Decoder</strong></td>
                        <td>T5</td>
                        <td>다양한 작업에 유연</td>
                        <td>구조 복잡, 파라미터 많음</td>
                    </tr>
                    <tr>
                        <td><strong>MoE</strong></td>
                        <td>GPT-4, Mixtral, Gemini</td>
                        <td>효율적 스케일링, 전문화</td>
                        <td>라우팅 오버헤드</td>
                    </tr>
                    <tr>
                        <td><strong>State Space</strong></td>
                        <td>Mamba, Liquid FMs</td>
                        <td>O(n) 복잡도, 메모리 효율</td>
                        <td>아직 초기 단계</td>
                    </tr>
                </table>

                <h3 style="margin-top: 40px; margin-bottom: 20px;">어텐션 메커니즘 비교</h3>
                <table class="comparison-table">
                    <tr>
                        <th>메커니즘</th>
                        <th>특징</th>
                        <th>사용 모델</th>
                    </tr>
                    <tr>
                        <td><strong>Standard MHA</strong></td>
                        <td>독립적 Key-Value, 높은 메모리</td>
                        <td>초기 Transformer 모델</td>
                    </tr>
                    <tr>
                        <td><strong>GQA</strong></td>
                        <td>Key-Value 공유, 효율성 증가</td>
                        <td>LLaMA 3, Mistral, Qwen3</td>
                    </tr>
                    <tr>
                        <td><strong>MLA</strong></td>
                        <td>잠재 표현 압축, 극한 효율</td>
                        <td>DeepSeek V3/V3.1</td>
                    </tr>
                    <tr>
                        <td><strong>Sliding Window</strong></td>
                        <td>고정 윈도우, 긴 시퀀스 효율</td>
                        <td>Mistral 7B</td>
                    </tr>
                </table>
            `;

            content.innerHTML = comparisonHTML;
            modal.style.display = 'block';
        }

        // Event Listeners
        document.getElementById('searchBox').addEventListener('input', (e) => {
            searchModels(e.target.value);
        });

        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                filterModels(e.target.dataset.filter);
            });
        });

        document.getElementById('compareBtn').addEventListener('click', showComparison);

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };

        // Initial render
        renderTimeline();
        updateFilterInfo();
    </script>
</body>
</html>
